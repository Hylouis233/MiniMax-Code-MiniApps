<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bot 看门狗</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1e222b;
        --line: #2a2f3a;
        --fg: #e6e9ef;
        --muted: #8b93a3;
        --ok: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
        --info: #58a6ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      }
      header {
        padding: 18px 22px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 { font-size: 17px; margin: 0; font-weight: 600; }
      .sub { color: var(--muted); font-size: 12px; }
      main { padding: 18px 22px 28px; max-width: 1100px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
      .card .n { font-size: 22px; font-weight: 650; line-height: 1.2; }
      .card .k { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .n.ok { color: var(--ok); } .n.warn { color: var(--warn); } .n.bad { color: var(--bad); } .n.info { color: var(--info); }
      .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
      button {
        background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 13px; cursor: pointer; font-size: 13px;
      }
      button:hover { border-color: #3a4150; }
      button[disabled] { opacity: .5; cursor: default; }
      .hint { color: var(--muted); font-size: 12px; }
      table { width: 100%; border-collapse: collapse; margin-top: 6px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 500; font-size: 12px; }
      td.err { color: var(--bad); font-size: 12px; }
      .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid; }
      .tag.revived { color: var(--ok); border-color: #1d4429; background: #12261a; }
      .tag.needs { color: var(--warn); border-color: #4a3a12; background: #241d0d; }
      .tag.failed { color: var(--bad); border-color: #4a1d1d; background: #261314; }
      .empty { color: var(--muted); padding: 28px 4px; text-align: center; }
      code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Bot 看门狗</h1>
      <span class="sub">挂掉的 bot 自动重新启用 · 额度类问题只提示不空烧</span>
    </header>
    <main>
      <div class="cards">
        <div class="card"><div class="n" id="cChecked">–</div><div class="k">监测到的 bot</div></div>
        <div class="card"><div class="n ok" id="cHealthy">–</div><div class="k">正常</div></div>
        <div class="card"><div class="n info" id="cRevived">–</div><div class="k">已自动重新启用</div></div>
        <div class="card"><div class="n warn" id="cNeeds">–</div><div class="k">需要你处理</div></div>
      </div>
      <div class="bar">
        <button id="btnRefresh">立即检查</button>
        <span class="hint" id="hint">每 30 秒自动巡检一次。</span>
      </div>
      <div id="list"></div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);

      function render(r) {
        $('cChecked').textContent = r.checked ?? 0;
        $('cHealthy').textContent = r.healthy ?? 0;
        $('cRevived').textContent = r.revived ?? 0;
        $('cNeeds').textContent = r.needsUser ?? 0;
        if (r.atMs) {
          $('hint').textContent = '最近检查：' + new Date(r.atMs).toLocaleTimeString() + ' · 每 30 秒自动巡检一次。';
        }
        const items = r.items || [];
        if (!items.length) {
          $('list').innerHTML = '<div class="empty">没有挂掉的 bot。全部正常。</div>';
          return;
        }
        let html = '<table><thead><tr><th>Bot</th><th>状态</th><th>错误</th><th>处理</th></tr></thead><tbody>';
        for (const it of items) {
          const tag =
            it.action === 'revived'
              ? '<span class="tag revived">已重新启用</span>'
              : it.action === 'needs-user'
                ? '<span class="tag needs">需你处理</span>'
                : '<span class="tag failed">重新启用失败</span>';
          html +=
            '<tr>' +
            '<td><strong>' + esc(it.botName || it.botId) + '</strong><br><span class="hint">' + esc(it.sessionId) + '</span></td>' +
            '<td>' + esc(it.reason || '') + '</td>' +
            '<td class="err">' + esc(String(it.errorCode || '') + ' ' + (it.errorMessage || '').slice(0, 90)) + '</td>' +
            '<td>' + tag + (it.detail ? '<br><span class="hint">' + esc(String(it.detail).slice(0, 80)) + '</span>' : '') + '</td>' +
            '</tr>';
        }
        html += '</tbody></table>';
        $('list').innerHTML = html;
      }

      function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      async function load(url) {
        const r = await fetch(url);
        return r.json();
      }

      async function refresh() {
        const btn = $('btnRefresh');
        btn.disabled = true;
        try {
          render(await load('/api/state'));
          render(await load('/api/tick'));
        } catch (e) {
          $('hint').textContent = '暂时读不到数据：' + e.message;
        } finally {
          btn.disabled = false;
        }
      }

      $('btnRefresh').addEventListener('click', refresh);
      load('/api/state').then(render).catch(() => {});
      setInterval(() => load('/api/state').then(render).catch(() => {}), 30000);
    </script>
  </body>
</html>
